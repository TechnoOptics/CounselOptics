<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advottic</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; width: 320px; margin: 0; padding: 14px; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
    p { font-size: 12px; color: #555; line-height: 1.4; margin: 0 0 10px; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #666; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; border: 1px solid #ddd; border-radius: 6px; }
    button { width: 100%; margin-top: 12px; padding: 8px 10px; font-size: 13px; font-weight: 600; border: 0; border-radius: 6px; background: #143a2c; color: white; cursor: pointer; }
    .ok { color: #11763d; font-size: 12px; margin-top: 8px; }
    .err { color: #b3261e; font-size: 12px; margin-top: 8px; }
    a { color: #143a2c; }
  </style>
</head>
<body>
  <h1>Advottic - Save to case</h1>
  <p>Highlight text on any page, right-click, then "Save to Advottic case." This popup just stores your API token + a default case ID.</p>

  <label for="token">API token</label>
  <input id="token" placeholder="adv_..." autocomplete="off" />

  <label for="case">Default case ID (optional)</label>
  <input id="case" placeholder="UUID" autocomplete="off" />

  <button id="save">Save</button>
  <div id="msg"></div>

  <p style="margin-top: 14px; font-size: 11px;">
    Get an API token at <a href="https://advottic.com/profile/api-tokens" target="_blank">advottic.com/profile/api-tokens</a>.
  </p>

  <script src="popup.js"></script>
</body>
</html>

// Advottic Wear OS companion - minimal native module.
//
// This is NOT the Capacitor app (a watch can't run that webview).
// It's a standalone-capable Wear OS app (Kotlin + Wear Compose). In
// Phase 1 it renders a placeholder glance; Phase 2 wires the
// Wearable Data Layer payload pushed by the phone-side AdvotticWatch
// Capacitor plugin (open-case count + latest update + deep link).
//
// Separate applicationId (com.advottic.watch): modern standalone
// Wear OS apps are distributed as their own Play Console listing -
// legacy phone-APK embedding is deprecated.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing - same scheme as :app. android/keystore.properties
// (gitignored) is written by the dev once / by CI from secrets, and
// the upload keystore is decoded into android/app/. The watch is a
// SEPARATE Play listing (com.advottic.watch) but the same upload key
// can sign it - so resolve that shared keystore from the Gradle root
// instead of duplicating the binary into this module.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.advottic.watch"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.advottic.watch"
        // Wear OS 3 = API 30 (the floor for modern standalone Wear).
        minSdkVersion 30
        // Wear OS 5 = API 34; Play's current Wear target requirement.
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // CI decodes the shared upload keystore into
                // android/app/; resolve it relative to the Gradle
                // root so :wear signs with the same key as :app.
                storeFile rootProject.file("app/" + keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // No shrinking for v1: a tiny Wear Compose app gains
            // little from R8 and Compose/Wear keep-rules are an easy
            // way to ship a broken first release. :app uses the same
            // posture. Revisit once the listing is live and stable.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only sign when the keystore is present, so a contributor
            // without it can still build unsigned variants locally.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Wear-specific Compose surfaces (Scaffold/Text/Chip styled for
    // round + small screens).
    implementation 'androidx.wear.compose:compose-material:1.4.0'
    implementation 'androidx.wear.compose:compose-foundation:1.4.0'

    // Phase 3a: "Open on phone" hand-off (RemoteActivityHelper opens
    // the case URL on the paired phone). Stable API, watch-only.
    // Fire-and-forget the returned future, so no extra futures dep.
    implementation 'androidx.wear:wear-remote-interactions:1.1.0'

    // Phase 3b: glanceable Tile. Plain ProtoLayout builders (no
    // protolayout-material) keep the version surface minimal; Guava
    // supplies Futures.immediateFuture for the synchronous tile -
    // the listenablefuture stub conflict is auto-resolved by Gradle.
    implementation 'androidx.wear.tiles:tiles:1.4.0'
    implementation 'androidx.wear.protolayout:protolayout:1.2.0'
    implementation 'com.google.guava:guava:33.3.1-android'

    // Data Layer client - declared now so Phase 2 (phone -> watch
    // payload) needs no dependency change, only code.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // Phase 3c: watch-face Complication data source - the flagship
    // "your next hearing on your watch face, 24/7" surface. The -ktx
    // artifact transitively pulls watchface-complications-data-source
    // and adds SuspendingComplicationDataSourceService (clean Kotlin
    // coroutine entry point) plus ComplicationDataSourceUpdateRequester
    // so the phone push can nudge the face instantly.
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'

    // Phase 3e: standalone freshness. A periodic WorkManager job
    // re-evaluates the local summary so the imminent-hearing alert
    // still fires - and the Tile/complication still update - when a
    // hearing crosses into the 24h window with no phone push (phone
    // off, watch out of range, the user just did not open the app).
    // WorkManager persists its queue across reboot itself, so no boot
    // receiver is needed.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Phase 4: QR device-link. ZXing core is a pure-Java QR encoder
    // (no Android dep); we render the BitMatrix to a Compose Canvas
    // ourselves. The watch then syncs DIRECTLY over HTTPS
    // (HttpURLConnection + org.json - no extra networking dep) to the
    // existing /api/v1/cases, sidestepping the Wearable Data Layer's
    // cross-package signing-cert requirement entirely.
    implementation 'com.google.zxing:core:3.5.3'

    // Unit tests for the pure logic (JSON parsers, countdown/tier
    // math, formatters). The real org.json is on the unit-test
    // classpath so the parsers run for real on the JVM instead of
    // hitting the stubbed android.jar "not mocked" JSONArray.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

apply plugin: 'com.android.application'

// Read release signing config from android/keystore.properties (gitignored).
// File is created by the dev once; CI passes the same values via env vars.
// Schema:
//   storeFile=advottic-release.keystore
//   storePassword=...
//   keyAlias=advottic
//   keyPassword=...
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.advottic.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.advottic.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // v1.0.5 (code 8): native OAuth handoff fix. Adds the iOS
        // Associated Domains entitlement + the matching
        // /.well-known/apple-app-site-association so "Continue with
        // Google / Microsoft / Apple" returns into the app instead
        // of stranding the session in the in-app Safari sheet.
        // Android App Links were already correct (assetlinks.json
        // matches the Play App Signing key) so this is an iOS-side
        // fix; the version bump keeps both stores in lockstep and is
        // required because Play + App Store Connect reject re-used
        // version codes.
        // v1.0.6 (code 9): native on-device Sign in with Apple (iOS).
        // "Continue with Apple" now uses the OS-native sheet via
        // @capacitor-community/apple-sign-in + Supabase
        // signInWithIdToken instead of opening a browser. Fail-safe:
        // falls back to the previous browser flow on any error.
        // Android unchanged functionally (web code auto-updates in
        // the remote-URL WebView); bump keeps store version codes
        // unique + in lockstep.
        // v1.0.7 (code 10): custom-scheme OAuth redirect. Native
        // sign-in now redirects to com.advottic.app://auth/callback
        // (registered: iOS CFBundleURLSchemes via ios-release.yml,
        // Android intent-filter here; allow-listed in Supabase
        // Redirect URLs). Custom schemes DO return to the app from
        // the iOS in-app Safari sheet (Universal Links do not), so
        // the OAuth session finally hands back to the WebView instead
        // of stranding "logged in, but in the browser". Native change
        // -> new build; codes must stay unique across both stores.
        // v1.0.8 (code 11): (1) ITSAppUsesNonExemptEncryption=false
        // baked into the iOS Info.plist so App Store Connect never
        // shows "Missing Compliance" again - builds auto-distribute to
        // internal testers with zero manual/operator login. (2) Apple
        // routed through the same proven custom-scheme browser flow as
        // Google/Microsoft (the capgo native-Apple path hung on iOS).
        // Custom scheme + gate (>=10) carried forward from 1.0.7.
        versionCode 11
        versionName "1.0.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only attach the signing config if keystore.properties exists; this
            // lets developers without the keystore still build unsigned debug
            // variants without the build crashing on a missing storeFile.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

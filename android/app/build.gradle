apply plugin: 'com.android.application'

// Read release signing config from android/keystore.properties (gitignored).
// File is created by the dev once; CI passes the same values via env vars.
// Schema:
//   storeFile=advottic-release.keystore
//   storePassword=...
//   keyAlias=advottic
//   keyPassword=...
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.advottic.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.advottic.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // v1.0.5 (code 8): native OAuth handoff fix. Adds the iOS
        // Associated Domains entitlement + the matching
        // /.well-known/apple-app-site-association so "Continue with
        // Google / Microsoft / Apple" returns into the app instead
        // of stranding the session in the in-app Safari sheet.
        // Android App Links were already correct (assetlinks.json
        // matches the Play App Signing key) so this is an iOS-side
        // fix; the version bump keeps both stores in lockstep and is
        // required because Play + App Store Connect reject re-used
        // version codes.
        // v1.0.6 (code 9): native on-device Sign in with Apple (iOS).
        // "Continue with Apple" now uses the OS-native sheet via
        // @capacitor-community/apple-sign-in + Supabase
        // signInWithIdToken instead of opening a browser. Fail-safe:
        // falls back to the previous browser flow on any error.
        // Android unchanged functionally (web code auto-updates in
        // the remote-URL WebView); bump keeps store version codes
        // unique + in lockstep.
        // v1.0.7 (code 10): custom-scheme OAuth redirect. Native
        // sign-in now redirects to com.advottic.app://auth/callback
        // (registered: iOS CFBundleURLSchemes via ios-release.yml,
        // Android intent-filter here; allow-listed in Supabase
        // Redirect URLs). Custom schemes DO return to the app from
        // the iOS in-app Safari sheet (Universal Links do not), so
        // the OAuth session finally hands back to the WebView instead
        // of stranding "logged in, but in the browser". Native change
        // -> new build; codes must stay unique across both stores.
        // v1.0.8 (code 11): (1) ITSAppUsesNonExemptEncryption=false
        // baked into the iOS Info.plist so App Store Connect never
        // shows "Missing Compliance" again - builds auto-distribute to
        // internal testers with zero manual/operator login. (2) Apple
        // routed through the same proven custom-scheme browser flow as
        // Google/Microsoft (the capgo native-Apple path hung on iOS).
        // Custom scheme + gate (>=10) carried forward from 1.0.7.
        // v1.0.9 (code 12): add @capacitor/camera so the one-time
        // PermissionsPrimer can proactively request Camera/Photos
        // (alongside Microphone + Notifications). NSCamera/NSPhoto
        // Info.plist strings already present; the exhibit HTML capture
        // in upload-form.tsx is unchanged. New native plugin -> new
        // build; codes stay unique across both stores.
        // v1.0.10 (code 13): premium native polish. iOS AppDelegate
        // patch (ios-release.yml) disables WKWebView rubber-band
        // overscroll (page no longer drags past its borders; sticky
        // header reads as locked) and enables the edge swipe-back
        // gesture. Android system-back is remapped to web-history
        // back via components/NativeBackGesture. Native AppDelegate
        // change -> new build; codes stay unique across both stores.
        // v1.0.11 (code 14): Wear OS Phase 2 - AdvotticWatchPlugin
        // (local Java Capacitor plugin, registered in MainActivity)
        // pushes an open-case summary over the Wearable Data Layer to
        // the :wear module. play-services-wearable added to :app.
        // Phone-side functional change -> new build; codes stay
        // unique across both stores.
        // v1.0.12 (code 15): consumer-tools surface refresh. Web app
        // shipped /templates (5 free templates), /tools/statute-of-
        // limitations (50-state checker), /tools/court-deadline-
        // calculator, /tools/security-deposit-deduction-checker, plus
        // /open-data, /people/abel-muchai, and 2 consumer comparison
        // pages (LegalZoom + Rocket Lawyer). All accessible inside the
        // remote-URL WebView; bump keeps store version codes unique +
        // updates the "What's New" section so Play + TestFlight
        // testers see the new surfaces highlighted.
        // v1.0.13 (code 16): Round 5-9 web shipping checkpoint. No
        // native Android changes; the bump promotes both stores to
        // "Open Testing" eligibility so the public TestFlight link +
        // the public Play Console testing URL are populated against a
        // build that reflects the latest consumer-facing surfaces.
        // v1.0.14 (code 17): (1) iOS app icon - CI now runs
        // @capacitor/assets generate --ios after regenerating ios/,
        // so TestFlight + the App Store tile finally show the gold-A
        // mark instead of Capacitor's placeholder. (2) Android
        // status-bar overlap - capacitor.config.ts sets
        // adjustMarginsForEdgeToEdge:'auto' so on Android 15+
        // (edge-to-edge forced by targetSdk 36) the WebView is
        // natively inset below the status bar; the header now starts
        // under the clock instead of behind it and stays locked while
        // scrolling. Native changes on both platforms -> new build;
        // codes stay unique across both stores.
        // v1.0.15 (code 18): Data-safety compliance. Google rejected
        // code 17 twice over "Device or other IDs" - its scanner
        // detected the Advertising ID via the AD_ID +
        // ACCESS_ADSERVICES_* permissions that Google Play Services /
        // Firebase auto-merge in. Advottic shows no ads and never
        // reads the advertising ID, so AndroidManifest.xml now
        // removes those permissions with tools:node="remove". The app
        // genuinely can't touch the advertising ID, so the scanner
        // stops flagging it. Manifest change -> new build; codes stay
        // unique across both stores.
        // v1.0.16 (code 19): Apple In-App Purchase (Guideline 3.1.1).
        // Adds @revenuecat/purchases-capacitor so iOS subscriptions are
        // sold through Apple StoreKit (RevenueCat bridge) instead of
        // Stripe. `cap sync ios` resolves the SPM package into the
        // freshly generated ios/ at build time, and xcodebuild's
        // -resolvePackageDependencies pulls it at archive time - no
        // workflow change needed. The web app gates the Subscribe button
        // to the Apple purchase sheet on iOS and re-exposes the
        // subscription nav (Stripe-only token top-ups + gifting stay
        // hidden). New native plugin -> new build; codes stay unique
        // across both stores.
        // v1.0.17 (code 21): rebuild to bundle @revenuecat/purchases-capacitor
        // 13.2.0 NATIVE plugin, matching the 13.2.0 JS SDK served from
        // advottic.com. The installed build 20 had an older native plugin, so
        // Purchases.configure() deadlocked the WebView JS thread synchronously
        // ("Subscribe loads indefinitely", Guideline 2.1(b)). A fresh archive
        // realigns native↔JS; no web change fixes a frozen JS thread. Build
        // number must be > 20 or App Store Connect rejects the upload.
        versionCode 21
        versionName "1.0.17"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only attach the signing config if keystore.properties exists; this
            // lets developers without the keystore still build unsigned debug
            // variants without the build crashing on a missing storeFile.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Wear OS bridge (AdvotticWatchPlugin -> Wearable Data Layer ->
    // the :wear module). Phone-side only; the :wear module declares
    // its own copy. Pinned to match the :wear module's 18.2.0.
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

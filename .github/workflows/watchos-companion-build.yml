# Verification build for the Apple Watch EMBEDDED-COMPANION reference
# project (ios-watch/).
#
# Purpose: prove the PAIRED architecture compiles end to end - the
# iOS-side WCSession bridge (PhoneWatchBridge) AND the watch-side
# receiver (the SAME ../watchos sources), with the watch embedded in
# an iOS host (related bundle ids, the relationship WCSession needs).
# This is the iOS analog of :wear:assembleDebug for the paired
# bridge, and it de-risks the deferred Mac-in-the-loop step of
# folding the watch target into the real signed Capacitor release.
#
# Build-only: -sdk iphonesimulator + CODE_SIGNING_ALLOWED=NO. No
# keystore / no provisioning / no distribution. Does NOT touch
# ios-release.yml or the Capacitor app (safe parallel build-out).
#
# Manual only - same posture as the other build/release workflows.
name: watchOS companion build (verify)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'One-line note for the run summary'
        required: false
        default: 'Embedded-companion bridge verification build'

permissions:
  contents: read

jobs:
  build-companion:
    name: Build embedded companion (iphonesimulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest-stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain
        run: |
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -qi 'iphonesimulator'; then
            echo "::error::No iOS simulator SDK on this image."
            xcodebuild -showsdks || true
            exit 1
          fi
          if ! xcodebuild -showsdks | grep -qi 'watchsimulator'; then
            echo "::error::No watchOS simulator SDK on this image (needed for the embedded watch app)."
            xcodebuild -showsdks || true
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios-watch
        run: |
          xcodegen generate
          if [ ! -d AdvotticWatchCompanion.xcodeproj ]; then
            echo "::error::xcodegen did not produce AdvotticWatchCompanion.xcodeproj"
            ls -la
            exit 1
          fi
          ls -la AdvotticWatchCompanion.xcodeproj

      - name: Build the iOS host + embedded watch (no signing)
        working-directory: ios-watch
        run: |
          set -o pipefail
          # Building the host scheme builds its embedded watch app
          # dependency too (Embed Watch Content phase), so one
          # invocation verifies BOTH halves of the bridge + the
          # pairing. -destination 'generic/platform=iOS Simulator'
          # (NOT a global `-sdk iphonesimulator`, which would force
          # the embedded watchOS sources to compile against the iOS
          # SDK) lets each target build for its own platform. Signing
          # off = pure compile/link verification.
          xcodebuild \
            -project AdvotticWatchCompanion.xcodeproj \
            -scheme AdvotticPhoneHost \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50

      - name: Report
        run: |
          echo "## Embedded-companion bridge built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** \`ios-watch\` (XcodeGen -> AdvotticWatchCompanion.xcodeproj)" >> $GITHUB_STEP_SUMMARY
          echo "iOS host + embedded watch (shared ../watchos sources) compiled with WCSession on both sides." >> $GITHUB_STEP_SUMMARY
          echo "**Toolchain:** $(xcodebuild -version | tr '\n' ' ')" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** ${{ inputs.release_notes }}" >> $GITHUB_STEP_SUMMARY

# Builds the signed iOS .ipa for App Store Connect / TestFlight upload.
#
# Why this workflow exists
# ------------------------
# Operator runs on Windows; iOS toolchain is Mac-only. GitHub's
# macOS runners come with Xcode, the iOS Simulator, and the App
# Store Connect command-line tools pre-installed. Combined with
# App Store Connect API key authentication (no Apple ID + 2FA
# dance), this workflow produces a TestFlight upload without ever
# touching a physical Mac.
#
# Xcode / SDK requirement (added after iOS run 5)
# -----------------------------------------------
# Apple now SERVER-SIDE REJECTS uploads built with an SDK older
# than iOS 26 (Xcode 26+):
#   "Validation failed (409) SDK version issue. This app was built
#    with the iOS 18.5 SDK. All iOS and iPadOS apps must be built
#    with the iOS 26 SDK or later ... in order to be uploaded to
#    App Store Connect."
# `macos-latest` still defaulted to Xcode 16.4 (iOS 18.5 SDK), so
# altool uploaded and then Apple rejected it during validation.
# We now pin the runner to macos-15 and explicitly select the
# latest-stable Xcode (>=26) before any xcodebuild invocation.
#
# Trigger
# -------
# Manual only (workflow_dispatch). Two inputs:
#   - upload_to_testflight: whether to push the IPA to App Store Connect
#     after the build. Default true. Set false for "just build, no
#     upload" diagnostic runs.
#   - release_notes: a short tag for the run summary. Cosmetic.
#
# Required GitHub Secrets (Repo Settings -> Secrets and variables ->
# Actions -> New repository secret):
#
#   APPLE_TEAM_ID
#     Your 10-character Apple Developer Team ID. Find it at
#     developer.apple.com/account -> Membership Details -> Team ID.
#     Looks like "ABCDE12345".
#
#   APP_STORE_CONNECT_API_KEY_ID
#     The 10-character Key ID for an App Store Connect API key with
#     "App Manager" access. Generate at
#     appstoreconnect.apple.com -> Users and Access -> Integrations ->
#     App Store Connect API -> Generate API Key. The Key ID is
#     listed on the row after you create it.
#
#   APP_STORE_CONNECT_API_ISSUER_ID
#     The UUID Issuer ID for your App Store Connect team. Same page
#     as above, shown at the top under "Issuer ID". Looks like
#     "57246542-96fe-1a63-e053-0824d011072a".
#
#   APP_STORE_CONNECT_API_KEY_BASE64
#     The .p8 private key file you download ONCE when creating the
#     API key (Apple does not let you re-download it). Base64-encode
#     the file:
#       macOS / Linux: `base64 -w 0 AuthKey_XXXXXXXXXX.p8`
#       Git Bash / WSL on Windows: same as above (use Git Bash, not
#       PowerShell, to avoid CRLF injection).
#     Paste the resulting single-line base64 string as the secret.
#
# Output
# ------
# The IPA is uploaded as a workflow artifact named `advottic-ipa`,
# and (when upload_to_testflight = true) also pushed to App Store
# Connect via xcrun altool. Allow ~10-30 minutes for the build to
# finish processing in App Store Connect -> TestFlight -> Builds.
#
# Cost
# ----
# macOS runners are billed at $0.08/minute on private repos beyond
# the GitHub Free monthly minute allowance (currently 2000 free
# Linux minutes which are *not* applicable to macOS). A typical
# Capacitor iOS build takes 15-25 minutes per run. Use this
# workflow sparingly - prefer batching multiple changes into one
# release. The first build always takes longer because Swift
# Package Manager resolves the Capacitor package sources fresh.

name: iOS release build

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the built IPA to App Store Connect TestFlight after the build?'
        type: boolean
        required: false
        default: true
      release_notes:
        description: 'One-line note for the build summary (does not become the App Store description)'
        required: false
        default: 'Manual iOS release build'

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build + sign + upload IPA
    # macos-15 (Sequoia) is the GitHub image that ships Xcode 26.
    # Xcode 26 requires macOS 15+, so macos-14 cannot host it and
    # `macos-latest` still resolved to an Xcode 16 default. Pin
    # explicitly so the SDK is deterministic across runner rollouts.
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # Read once at top-level so all steps see the same value.
      # capacitor.config.ts pins this to com.advottic.app; mirror here
      # so xcodebuild can resolve provisioning profiles by bundle ID.
      IOS_BUNDLE_ID: com.advottic.app
      # Marketing + build numbers. The build number must be unique
      # per upload to App Store Connect; align it to the Android
      # versionCode so the two stores stay in sync. Read both from
      # android/app/build.gradle at runtime (single source of truth).
      # Xcode 16 renamed the export method: "app-store" is deprecated
      # and warns "Use 'app-store-connect' instead." (seen in iOS run
      # 4 export logs). Use the new spelling.
      EXPORT_METHOD: app-store-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest-stable Xcode (>= 26, Apple upload mandate)
        # Apple rejects uploads built with < iOS 26 SDK. The runner
        # image ships several Xcodes; the default `xcode-select` may
        # still point at an older one. maxim-lobanov/setup-xcode
        # switches the active developer dir to the newest stable
        # Xcode installed on the image. If the image somehow lacks
        # Xcode 26 the action fails loudly here (good - far better
        # than building the wrong SDK and getting rejected post-
        # upload like iOS run 5 did).
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain (assert iOS 26 SDK)
        # Hard gate: read the active SDK and fail the job NOW if it
        # is older than iOS 26, so a stale runner image surfaces a
        # clear error instead of a confusing 409 from altool 20
        # minutes later.
        run: |
          xcodebuild -version
          SDK_VER=$(xcodebuild -showsdks | sed -nE 's/.*iphoneos([0-9]+)\..*/\1/p' | sort -n | tail -1)
          echo "Newest installed iOS SDK major version: ${SDK_VER:-unknown}"
          if [ -z "$SDK_VER" ] || [ "$SDK_VER" -lt 26 ]; then
            echo "::error::Active Xcode exposes iOS SDK ${SDK_VER:-?} but Apple requires >= 26 for App Store Connect uploads. The runner image needs Xcode 26+."
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Read version + build number from android/app/build.gradle
        # The Android side already pins versionCode + versionName for
        # this release (latest commit bumped to 7 / 1.0.4). Reading
        # them here keeps Android and iOS lockstep without a manual
        # second source-of-truth bump.
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\b' android/app/build.gradle | head -1 | sed -E 's/.*versionName "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode\b' android/app/build.gradle | head -1 | sed -E 's/.*versionCode ([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not parse versionName / versionCode from android/app/build.gradle"
            exit 1
          fi
          echo "MARKETING_VERSION=$VERSION_NAME" >> $GITHUB_ENV
          echo "CURRENT_PROJECT_VERSION=$VERSION_CODE" >> $GITHUB_ENV
          echo "## iOS release inputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Marketing version (CFBundleShortVersionString):** $VERSION_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Build number (CFBundleVersion):** $VERSION_CODE" >> $GITHUB_STEP_SUMMARY
          echo "**Bundle ID:** ${IOS_BUNDLE_ID}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger note:** ${{ inputs.release_notes }}" >> $GITHUB_STEP_SUMMARY

      - name: Validate required iOS secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          missing=()
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID")
          [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] && missing+=("APP_STORE_CONNECT_API_KEY_ID")
          [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ] && missing+=("APP_STORE_CONNECT_API_ISSUER_ID")
          [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ] && missing+=("APP_STORE_CONNECT_API_KEY_BASE64")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            echo "See the workflow header for instructions on where to find each value."
            exit 1
          fi
          echo "All 4 required secrets are present."

      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          # xcrun looks for the key in ~/private_keys with the
          # canonical filename AuthKey_<KEY_ID>.p8 (this is an
          # undocumented convention; see man xcodebuild).
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          # Same defense as the Android keystore: strip whitespace
          # before decoding so a CRLF-tainted secret doesn't
          # silently corrupt the key.
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          # Sanity-check: a real .p8 starts with "-----BEGIN PRIVATE KEY-----".
          if ! head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::Decoded key file doesn't look like a .p8 (missing BEGIN PRIVATE KEY header)."
            echo "First 64 bytes of decoded content:"
            head -c 64 "$KEY_FILE" | xxd
            exit 1
          fi
          echo "API key decoded to $KEY_FILE"

      - name: Create ios/ via Capacitor (fresh per-run)
        # We deliberately don't commit the ios/ directory. Reasons:
        # (a) Xcode project format churns across Xcode releases and
        #     produces noisy diffs; (b) every `cap add ios` already
        #     reads from capacitor.config.ts so the result is
        #     deterministic; (c) skipping ios/ in the repo keeps
        #     Windows-on-the-dev-machine workflows simple.
        #
        # Do NOT `mkdir -p ios` first: unlike the Android assets dir,
        # `cap add ios` creates ios/ itself and ABORTS with "ios
        # platform already exists" if the directory is present (even
        # if empty). Run 1 failed exactly this way. We instead remove
        # any stale ios/ to make the step idempotent on reruns.
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Generate iOS app icon + splash from assets/
        # The ios/ project is regenerated fresh every run, which left
        # Capacitor's TEMPLATE placeholder AppIcon in the bundle -
        # that's why TestFlight and the App Store Connect app list
        # showed a blank wireframe tile instead of the gold-A mark.
        # The repo already carries the source art in assets/
        # (icon-only.png, icon-foreground/background, splash,
        # splash-dark) and @capacitor/assets in devDependencies; run
        # it for iOS only (Android launcher icons are committed under
        # android/app/src/main/res and need no generation). Fails
        # LOUDLY if no AppIcon PNG materializes so we never silently
        # ship the placeholder again.
        run: |
          npx @capacitor/assets generate --ios
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          COUNT=$(ls "$ICONSET"/*.png 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::@capacitor/assets produced no PNGs in $ICONSET - placeholder icon would ship"
            exit 1
          fi
          echo "Generated $COUNT AppIcon PNG(s)"
          ls -la "$ICONSET"

      - name: Patch AppDelegate (premium webview - no rubber-band + swipe-back)
        # Two native WKWebView tweaks Capacitor's config cannot express:
        #   1. scrollView.bounces = false  -> kills the iOS elastic
        #      overscroll so the page never drags past its borders and
        #      the sticky header stays bolted to the top.
        #   2. allowsBackForwardNavigationGestures = true -> the iOS
        #      edge swipe-back gesture navigates web history like a
        #      native push/pop.
        # ios/ is regenerated every run, so we patch the generated
        # AppDelegate.swift (already in the pbxproj) right after
        # `cap add ios`. Fails LOUDLY if Capacitor's template shifts,
        # rather than silently shipping without the polish.
        run: |
          AD=ios/App/App/AppDelegate.swift
          if [ ! -f "$AD" ]; then
            echo "::error::$AD not found - Capacitor iOS template changed"
            exit 1
          fi
          if ! grep -q 'import Capacitor' "$AD" || ! grep -q 'didFinishLaunchingWithOptions' "$AD"; then
            echo "::error::AppDelegate.swift not in expected Capacitor shape - aborting webview patch"
            exit 1
          fi
          if grep -q 'AdvotticWebView.install' "$AD"; then
            echo "AppDelegate already patched - skipping"
          else
            # Insert the call right after the didFinishLaunching brace.
            # $& is the whole match; single-quoted -e keeps it perl, not shell.
            perl -0777 -pi -e 's/didFinishLaunchingWithOptions[^{]*\{/$&\n        AdvotticWebView.install()/' "$AD"
            if ! grep -q 'AdvotticWebView.install' "$AD"; then
              echo "::error::failed to insert AdvotticWebView.install() call site"
              exit 1
            fi
            # Append the helper. Single-quoted 'SWIFT' so $0 (Swift
            # closure shorthand) is NOT shell-expanded. The SWIFT
            # terminator sits at the YAML block indent, so after YAML
            # strips that indent it lands at column 0 and closes the
            # heredoc correctly (same mechanic as the entitlements step).
            cat >> "$AD" <<'SWIFT'

          // Advottic native polish - Capacitor exposes no config for
          // these WKWebView properties, so set them after launch:
          // scrollView.bounces=false kills the iOS rubber-band so the
          // page never drags past its borders and the sticky header
          // reads as locked; allowsBackForwardNavigationGestures maps
          // the iOS edge swipe-back to web-history back. Hooked on the
          // bulletproof UIKit didBecomeActive notification (no
          // Capacitor-specific symbol - an earlier build failed
          // because Notification.Name.capacitorViewDidLoad does not
          // exist), with a short retry until the bridge webView is
          // attached. Idempotent - re-applying is harmless.
          enum AdvotticWebView {
              static func install() {
                  NotificationCenter.default.addObserver(forName: UIApplication.didBecomeActiveNotification, object: nil, queue: .main) { _ in
                      apply(retries: 12)
                  }
              }
              private static func apply(retries: Int) {
                  let root = UIApplication.shared.windows.first(where: { $0.isKeyWindow })?.rootViewController
                  let vc = (root as? CAPBridgeViewController) ?? root?.children.compactMap({ $0 as? CAPBridgeViewController }).first
                  if let webView = vc?.webView {
                      webView.allowsBackForwardNavigationGestures = true
                      webView.scrollView.bounces = false
                      webView.scrollView.alwaysBounceVertical = false
                      webView.scrollView.alwaysBounceHorizontal = false
                      return
                  }
                  if retries > 0 {
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.25) {
                          apply(retries: retries - 1)
                      }
                  }
              }
          }
          SWIFT
            echo "AppDelegate patched: webview lock + swipe-back"
          fi
          echo "--- AppDelegate.swift tail ---"
          tail -24 "$AD"

      - name: Patch Info.plist with version + build number + privacy strings
        # Capacitor 8 leaves CFBundleShortVersionString and
        # CFBundleVersion at their template defaults ("1.0" / "1").
        # App Store Connect rejects an upload whose CFBundleVersion
        # is already used on an existing build, so we set them
        # explicitly to the Android-side values.
        #
        # The NSxxxUsageDescription privacy strings ALSO live here -
        # NOT in capacitor.config.ts. `infoPlist` is not a
        # CapacitorConfig field, so the strings that used to be in the
        # config were (a) ignored by `cap sync` (never reached the
        # binary - builds 6/7 shipped without them) and (b) a hard
        # `next build` type error that broke every Vercel deploy.
        # PlistBuddy writing them into the freshly-generated
        # ios/App/App/Info.plist is the only thing that actually puts
        # them in the signed app. iOS enforces these at first call
        # into each protected API; a missing string crashes the app
        # on first use and gets the submission rejected under App
        # Review Guideline 5.1.1.
        run: |
          INFO_PLIST=ios/App/App/Info.plist
          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::$INFO_PLIST does not exist after cap add. Did the iOS bootstrap fail?"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${MARKETING_VERSION}" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${CURRENT_PROJECT_VERSION}" "$INFO_PLIST"

          # Upsert helper: Set if the key exists, else Add it. The
          # ios/ dir is regenerated fresh every run (rm -rf ios) so
          # these keys never pre-exist, but the fallback keeps the
          # step idempotent if that ever changes.
          plist_str() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$INFO_PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$INFO_PLIST"
          }
          # Strings are first-person + action-oriented + jurisdiction-
          # neutral so an App Review 5.1.1 reader does not flag them
          # for over-collection. None contain quotes/apostrophes, so
          # PlistBuddy's rest-of-line value parsing is safe here.
          plist_str NSFaceIDUsageDescription "Use Face ID to sign in to Advottic without typing your email each time. Your biometric data never leaves this device."
          plist_str NSMicrophoneUsageDescription "Use the microphone to dictate case notes. Audio is transcribed on-device by iOS and never uploaded."
          plist_str NSSpeechRecognitionUsageDescription "Convert your spoken notes to text so you can add them to a case file. Recognition runs on-device when possible."
          plist_str NSCameraUsageDescription "Photograph documents, citations, and exhibits to add them directly to your case file. Photos stay private to your account."
          plist_str NSPhotoLibraryUsageDescription "Attach existing photos as case exhibits. Advottic only reads the photos you explicitly choose."
          plist_str NSPhotoLibraryAddUsageDescription "Save your case packet PDF to your photo library so you can share or print it."

          # NSUserTrackingUsageDescription is deliberately NOT set and is
          # actively stripped here. Advottic makes no AppTrackingTransparency
          # call and declares "No, we do not use ... for tracking purposes"
          # on every one of the 12 data types in the App Privacy nutrition
          # label. When this key is present, App Store Connect treats the
          # binary as declaring tracking intent and HARD-BLOCKS publishing
          # the privacy labels ("you must indicate which data types are
          # tracking users") - and the Publish button greys out. That is the
          # exact mirror of the Android AD_ID rejection: deleting the key
          # (rather than declaring fake tracking) keeps the label honest and
          # unblocks the 1.0 submission. ios/ is regenerated fresh each run
          # (rm -rf ios) so this normally no-ops, but the Delete is kept as
          # a guard in case Capacitor or a plugin re-introduces it.
          /usr/libexec/PlistBuddy -c "Delete :NSUserTrackingUsageDescription" "$INFO_PLIST" 2>/dev/null || true

          # Export compliance, declared in Info.plist so App Store
          # Connect NEVER shows the "Missing Compliance" prompt again.
          # This is the Info.plist form of the answer already given on
          # builds 7/8/9 ("None of the above" = no non-exempt
          # encryption; the app only uses standard HTTPS/TLS, which is
          # exempt). Apple's own export-compliance dialog explicitly
          # points here. Effect: every build is immediately "Ready to
          # Test" and auto-distributes to internal testers with zero
          # manual App Store Connect step / no operator login.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST"

          # Register the custom URL scheme com.advottic.app:// so iOS
          # hands the OAuth deep-link callback back to the app from the
          # SFSafariViewController. iOS suppresses Universal Links back
          # to the app that presented the SFSafariViewController, so an
          # https callback can never return - but a custom scheme does.
          # This scheme is allow-listed in Supabase Auth -> URL
          # Configuration and used as the native OAuth redirectTo in
          # app/sign-in/sign-in-buttons.tsx. ios/ is regenerated fresh
          # each run (rm -rf ios), so delete-then-add is deterministic.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.advottic.app" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.advottic.app" "$INFO_PLIST"

          echo "Patched Info.plist:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$INFO_PLIST"
          for k in NSFaceIDUsageDescription NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            printf '  %s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$INFO_PLIST"
          done
          # Assert NSUserTrackingUsageDescription is ABSENT so the App
          # Privacy "no tracking" nutrition label stays publishable (its
          # presence greys out the Publish button). Fail the build if
          # anything re-introduced the key.
          if /usr/libexec/PlistBuddy -c "Print :NSUserTrackingUsageDescription" "$INFO_PLIST" >/dev/null 2>&1; then
            echo "::error::NSUserTrackingUsageDescription is present in Info.plist; it must be absent (Advottic does not track users). Remove it before release."
            exit 1
          fi
          echo "  NSUserTrackingUsageDescription = (absent, as required)"

      - name: Add Sign in with Apple + Associated Domains entitlements
        # Two entitlements, both required for auth to work natively:
        #
        # 1. com.apple.developer.applesignin
        #    The website offers Sign in with Apple alongside Google +
        #    Microsoft, so App Review Guideline 4.8 requires the app
        #    to offer it too. Tells Apple's signing service to issue
        #    a profile with the Sign in with Apple capability.
        #
        # 2. com.apple.developer.associated-domains -> applinks:advottic.com
        #    THE FIX for "OAuth session stays in the browser." Without
        #    this entitlement (plus the matching AASA file served at
        #    https://advottic.com/.well-known/apple-app-site-association)
        #    iOS has no association telling it that
        #    advottic.com/auth/callback belongs to this app. The
        #    SFSafariViewController opened for OAuth finishes the
        #    Supabase redirect itself, the session cookies land in
        #    Safari's jar, and App.appUrlOpen in sign-in-buttons.tsx
        #    never fires - the user is "signed in" only in the browser
        #    sheet. With the entitlement, iOS hands the
        #    advottic.com/auth/callback Universal Link back into the
        #    app, the listener closes the tab and replays the callback
        #    in the WebView whose origin IS advottic.com, so the
        #    session lands where it belongs. This is the iOS mirror of
        #    the Android App Links intent-filter already in
        #    AndroidManifest.xml.
        #
        # Only advottic.com (apex) - the WebView's server.url is the
        # apex and www -> apex is a 301 that would break AASA fetch
        # for a www applinks entry.
        #
        # `cap add ios` does NOT add either entitlement by default
        # because Capacitor doesn't know which OAuth flows the app
        # uses. We inject them so the Xcode project's
        # CODE_SIGN_ENTITLEMENTS build setting picks them up.
        run: |
          ENT_FILE=ios/App/App/App.entitlements
          cat > "$ENT_FILE" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array>
              <string>Default</string>
            </array>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:advottic.com</string>
              <string>webcredentials:advottic.com</string>
            </array>
          </dict>
          </plist>
          EOF
          echo "Wrote Sign in with Apple + Associated Domains entitlements to $ENT_FILE"
          # Make sure the Xcode project references this file.
          PROJECT=ios/App/App.xcodeproj/project.pbxproj
          if ! grep -q "App.entitlements" "$PROJECT"; then
            # cap-cli registers the entitlement reference inside the
            # build configuration list. If a future Capacitor release
            # changes that behavior, this grep will fail and we'll
            # need to inject it manually here. Fail loudly so the
            # break surfaces in the build log instead of silently
            # producing an unsigned binary.
            echo "::warning::App.entitlements is not referenced by the Xcode project. Apple Sign-In may not be enabled on the signed binary."
          fi

      # NOTE: no `pod install` step. Capacitor 8.3.4 defaults to Swift
      # Package Manager, not CocoaPods - `cap sync ios` writes a
      # Package.swift and there is NO Podfile / .xcworkspace. SPM
      # dependencies are resolved by xcodebuild itself at archive
      # time (-scheme App against App.xcodeproj). iOS run 2 failed
      # here with "No Podfile found"; the fix is to delete this step
      # and target the .xcodeproj directly below.

      - name: Build and archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        working-directory: ios/App
        run: |
          # -allowProvisioningUpdates + the App Store Connect API key
          # together let xcodebuild fetch / regenerate the
          # provisioning profile at build time without any local
          # cert/profile management. This is the path that lets us
          # build iOS from a CI runner with zero stored certificates.
          #
          # DEVELOPMENT_TEAM resolves Apple to the right team when
          # multiple are accessible from the API key.
          # PROVISIONING_PROFILE_SPECIFIER="" disables Xcode's
          # attempt to pin to a specific named profile; with
          # -allowProvisioningUpdates the auto-fetched profile is
          # used instead.
          # Capacitor 8 SPM project: build the .xcodeproj directly.
          # There is no .xcworkspace (that's a CocoaPods artifact).
          # -scheme App resolves SPM package deps automatically.
          # -resolvePackageDependencies first so a slow SPM fetch is
          # its own log section rather than buried in the archive.
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies
          # IMPORTANT: archive UNSIGNED.
          #
          # iOS run 3 failed here: with CODE_SIGN_STYLE=Automatic the
          # archive's GatherProvisioningInputs phase resolved an
          # "iOS App Development" profile and then errored with
          # "Your team has no devices ... No profiles for
          # 'com.advottic.app' were found". Development profiles
          # require registered test devices; a CI runner has none and
          # we don't want a development profile anyway - we want an
          # App Store distribution profile.
          #
          # The robust zero-cert CI pattern: archive with code
          # signing disabled, then let the EXPORT step (method:
          # app-store, signingStyle: automatic, + the App Store
          # Connect API key) create the Apple Distribution
          # certificate and App Store provisioning profile and sign
          # the IPA. Export knows it's distribution, so it never
          # tries the device-bound development path.
          # NOTE: do NOT pass PRODUCT_BUNDLE_IDENTIFIER on the
          # xcodebuild command line. A build-setting override there is
          # GLOBAL - it applies to every target in the build, not just
          # the App target. Once @capacitor/camera was added (v1.0.9 /
          # build 12) its framework + PrivacyInfo resource bundle also
          # got stamped com.advottic.app, and the upload failed with
          # "CFBundleIdentifier Collision. There is more than one
          # bundle with the CFBundleIdentifier value 'com.advottic.app'
          # under 'App.app'." The App target already gets
          # com.advottic.app from the Capacitor-generated project
          # (capacitor.config.ts appId), and plugin sub-bundles must
          # keep their own distinct identifiers - so the override is
          # both unnecessary and actively breaks multi-bundle plugins.
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM=${APPLE_TEAM_ID} \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        working-directory: ios/App
        run: |
          # Generate the ExportOptions.plist that xcodebuild
          # -exportArchive needs. Inlined here (rather than checked
          # into the repo) so the team ID is read fresh from the
          # secret on every run.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID ${APP_STORE_CONNECT_API_KEY_ID} \
            -authenticationKeyIssuerID ${APP_STORE_CONNECT_API_ISSUER_ID}

      - name: Verify IPA + report size
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::error::No IPA found in $RUNNER_TEMP/export/"
            ls -la "$RUNNER_TEMP/export/" || true
            exit 1
          fi
          SIZE_BYTES=$(stat -f%z "$IPA")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1024 / 1024}")
          echo "## IPA produced" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Path on runner:** \`$IPA\`" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${SIZE_MB} MB ($SIZE_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          # Stash for the next step.
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: advottic-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight via App Store Connect
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          # CRITICAL: pipefail. Without it, `altool ... | tee`
          # returns tee's exit status (always 0), so a FAILED upload
          # reports the step as green. That is exactly what masked
          # iOS run 5: altool hit "Validation failed (409) SDK
          # version issue" and exited non-zero, but the job went
          # green and nothing reached TestFlight. With pipefail the
          # pipeline now carries altool's real exit code and the
          # `-e` shell aborts the step on failure.
          set -o pipefail
          # xcrun altool reads the API key from
          # ~/private_keys/AuthKey_<id>.p8 by default when the
          # --apiKey + --apiIssuer flags are provided. Output is
          # noisy but the exit code is the source of truth.
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --output-format json | tee "$RUNNER_TEMP/altool-output.json"
          # Belt-and-suspenders: even if a future altool build
          # returns 0 on a soft error, fail the step if the JSON
          # carries a product-errors array.
          if grep -q '"product-errors"' "$RUNNER_TEMP/altool-output.json"; then
            echo "::error::altool reported product-errors - upload did NOT reach TestFlight. See JSON above."
            exit 1
          fi
          echo "## TestFlight upload" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Uploaded \`$IPA_PATH\` to App Store Connect." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Allow 10-30 minutes for Apple's TestFlight processing pipeline before the build appears in App Store Connect -> TestFlight -> iOS." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If processing fails you'll get an email at the Apple ID of the team's primary contact. Common causes: missing Privacy Manifest, ITMS-90189 (CFBundleVersion already used)." >> $GITHUB_STEP_SUMMARY

      - name: Clean up secrets-derived files
        if: always()
        run: |
          rm -rf ~/private_keys
          rm -f "$RUNNER_TEMP/ExportOptions.plist"

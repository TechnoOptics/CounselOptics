# Source-invariant regression guards (SOC 2 CC8.1 change-management). These
# are the drift-guards under scripts/test/*.mjs: they read source files and
# fail the build if a load-bearing invariant is silently removed by a refactor
# (counsel routing, Bella markdown safety, signing anchors, consumer i18n +
# a11y wiring). Most are pure-Node; signature-anchors.mjs builds a real PDF with pdf-lib, so the job runs
# `npm ci` (cached) first - still fast enough to run on every push and PR.
name: Guards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Most guards are pure-Node, but signature-anchors.mjs builds a real
      # PDF with pdf-lib, so the guards need the dependencies installed.
      - name: Install dependencies
        run: npm ci
      - name: Run source-invariant guards
        run: npm run test:audit-guards

      # The unit and invariant suite, which until now ran ONLY on developer
      # machines. Nothing in CI executed it, so 173 files and 2962 tests could
      # not fail a push or a pull request, and a branch that broke them merged
      # green. That was the largest gap of its kind in the repo: an audit that
      # reports a clean result for input it never read.
      #
      # Placed AFTER the source-invariant guards on purpose. Those are seconds
      # of pure-Node string work and catch the coarse regressions, so letting
      # them speak first keeps the common failure legible instead of buried
      # under a suite run.
      #
      # No `--coverage` and no reporter flags: this step exists to answer one
      # question, whether the suite passes, and every extra artifact is another
      # thing that can fail for reasons unrelated to the code.
      - name: Run the test suite
        run: npx vitest run

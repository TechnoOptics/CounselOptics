# Builds the signed Android App Bundle (.aab) for Play Store upload.
#
# Why this workflow exists
# ------------------------
# The Advottic dev machine is Windows; Android SDK + Gradle are heavy
# to install just to ship one binary. GitHub's Ubuntu runners come
# with the Android SDK + JDK pre-installed and rebuild a clean
# environment on every run, which means the AAB is reproducible
# regardless of which laptop the operator is on.
#
# Trigger
# -------
# Manual only (workflow_dispatch). You click "Run workflow" in the
# Actions tab when you want a release build. We deliberately do NOT
# auto-build on every push to main - Play Store doesn't accept two
# uploads with the same versionCode, so an unintentional build that
# eats the next versionCode would force a `git revert` + bump.
#
# Required GitHub Secrets (Repo Settings -> Secrets and variables ->
# Actions -> New repository secret):
#
#   ANDROID_KEYSTORE_BASE64
#     Base64-encoded contents of android/app/advottic-release.keystore.
#     On Windows: `certutil -encode advottic-release.keystore tmp.b64`
#     (then strip the -----BEGIN/END----- header/footer lines).
#     On macOS / Linux: `base64 -w0 advottic-release.keystore`.
#
#   ANDROID_STORE_PASSWORD
#     The `storePassword` from android/keystore.properties.
#
#   ANDROID_KEY_ALIAS
#     The `keyAlias` from android/keystore.properties (e.g. "advottic").
#
#   ANDROID_KEY_PASSWORD
#     The `keyPassword` from android/keystore.properties.
#
# The four secrets reproduce keystore.properties at build time and
# decode the keystore back into android/app/. Both are local to the
# runner and discarded when the job exits.
#
# Output
# ------
# The AAB is uploaded as a workflow artifact named `advottic-aab`.
# Download from the run's Summary page (Artifacts section, bottom).

name: Android release build

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'One-line note for the build (logged in the summary, doesn''t affect the AAB)'
        required: false
        default: 'Manual release build'

permissions:
  contents: read

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Capacitor 8.3.4 declares `engines.node >=22`; Node 20 emits
          # EBADENGINE warnings and is going away from GitHub runners in
          # Sep 2026 anyway. Run on 22 LTS.
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Capacitor 8.3.4's @capacitor/android library is built
          # with --source 21, so the consumer must also compile on
          # JDK 21+. JDK 17 fails with "invalid source release: 21"
          # during :capacitor-android:compileReleaseJavaWithJavac.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compile-sdk 36 + build-tools 36 match android/variables.gradle.
          # The action also installs the platform-tools and required
          # build-tool revisions before gradle runs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm ci

      - name: Decode keystore into android/app/
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty. See workflow header for how to set it."
            exit 1
          fi
          # Strip whitespace (CR, LF, tabs, spaces) before decoding.
          # When the secret is piped into `gh secret set` from a
          # Windows PowerShell pipeline, the runner sees a trailing
          # \r that GNU `base64 --decode` rejects with "invalid input".
          # The strip handles that path AND any user who pastes a
          # multi-line base64 dump (default certutil output) without
          # collapsing it first.
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > android/app/advottic-release.keystore
          SIZE=$(stat -c%s android/app/advottic-release.keystore)
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Decoded keystore is only $SIZE bytes. ANDROID_KEYSTORE_BASE64 was probably pasted incorrectly."
            exit 1
          fi
          echo "Decoded keystore: $SIZE bytes"

      - name: Write keystore.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing one of ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
            exit 1
          fi
          # Trim trailing whitespace from each secret. When `gh secret
          # set` is piped from a Windows PowerShell pipeline, the
          # secret arrives with a trailing \r. gradle's
          # Properties.load() reads it literally, so the storePassword
          # becomes "password\r" and the keystore unlock fails with
          # "tampered with or password was incorrect".
          STORE_PW=$(printf '%s' "$ANDROID_STORE_PASSWORD" | tr -d '\r\n')
          KEY_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
          KEY_PW=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          cat > android/keystore.properties <<EOF
          storeFile=advottic-release.keystore
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF
          # Print the file with passwords redacted so the log shows
          # the structure is right without leaking the secrets.
          sed -E 's/(Password=).*/\1***REDACTED***/g' android/keystore.properties

      - name: Capacitor sync (push capacitor.config + plugins into android/)
        run: |
          # android/app/src/main/assets/ is gitignored (its contents are
          # regenerated by `cap sync` on every build). On a fresh clone
          # the parent dir doesn't exist, and `cap sync` fails with
          # ENOENT trying to write capacitor.config.json into it.
          # Pre-create the dir so the first sync on a clean runner has
          # somewhere to land its output.
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Print build inputs
        run: |
          echo "## Android build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger note:** ${{ inputs.release_notes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'versionCode|versionName' android/app/build.gradle | sed 's/^[[:space:]]*//' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed AAB + sideloadable APK
        # bundleRelease -> .aab for Play. assembleRelease -> a signed
        # universal .apk that installs straight onto a phone via adb,
        # with no Play account, for testing the native shell (e.g.
        # the AdvotticWatch plugin that pushes case data to the watch)
        # on a real device now.
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --console=plain --no-daemon

      - name: Verify AAB exists + report size
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB was not produced at $AAB"
            ls -R android/app/build/outputs/ || true
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$AAB")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1024 / 1024}")
          echo "## AAB built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Path:** \`$AAB\`" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${SIZE_MB} MB ($SIZE_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Upload the **.aab** to Google Play Console -> Internal testing. To test the watch sync NOW without Play, grab the **.apk** artifact and sideload it (adb install -r) onto the phone paired to the watch." >> $GITHUB_STEP_SUMMARY

      - name: Verify signed APK + report
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::Signed phone APK was not produced"
            ls -R android/app/build/outputs/apk/ || true
            exit 1
          fi
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s "$APK") / 1024 / 1024}")
          echo "## Sideloadable phone APK built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Path:** \`$APK\` (${SIZE_MB} MB)" >> $GITHUB_STEP_SUMMARY
          echo "Install on the watch-paired phone: \`adb install -r app-release.apk\`, then open Advottic -> Cases to push to the watch." >> $GITHUB_STEP_SUMMARY

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: advottic-aab
          # The artifact name + path produce a single-file zip:
          # `advottic-aab.zip` containing `app-release.aab`.
          path: android/app/build/outputs/bundle/release/app-release.aab
          # 30-day retention: long enough to recover from a botched
          # Play Console upload, short enough to keep storage tidy.
          retention-days: 30
          if-no-files-found: error

      - name: Upload sideloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: advottic-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Clean up secrets-derived files
        if: always()
        run: |
          # The runner is destroyed after the job, so this is belt-and-
          # suspenders. Still nice to make explicit that we erase the
          # keystore + properties before the upload step finishes.
          rm -f android/app/advottic-release.keystore
          rm -f android/keystore.properties

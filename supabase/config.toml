# Local Supabase stack for the marketing captures.
#
# This file exists so a capture run can build a database from nothing on a
# laptop or in CI. It is deliberately not a description of production: nothing
# here is deployed, and `supabase link` is not part of the capture path.
#
# See docs/DEMO-CAPTURES.md for how the stack is started and seeded, and for
# the rule that captures never point at production.
project_id = "advottic-demo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Captures must not send mail. Inbucket catches anything the app emits so no
# message can leave the machine.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# The demo users are created by the seed with the service-role key, so no
# address is ever confirmed by clicking a link.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
